CONFIG_ZMK_KEYBOARD_NAME="Allium58"
CONFIG_ZMK_STUDIO=y

# Disable deep sleep — it causes BLE disconnects on macOS that are hard to recover from
CONFIG_ZMK_SLEEP=n
# Stay active for 2 hours of idle before sleeping (milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Max TX power for stable BLE connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_POINTING=y
